name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python-automation-pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python-automation-pro/requirements.txt
            python-automation-pro/requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar suíte de testes
        run: python -m pytest tests/ -q -p no:cacheprovider
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
